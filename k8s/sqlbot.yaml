apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlbot
  namespace: sqlbot
  labels:
    app.kubernetes.io/name: sqlbot
    app.kubernetes.io/component: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sqlbot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sqlbot
        app.kubernetes.io/component: application
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done;",
            ]
        - name: wait-for-redis
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z redis-service 6379; do echo waiting for redis; sleep 2; done;",
            ]
      containers:
        - name: sqlbot
          image: dataease/sqlbot:latest # Replace with your image registry
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8001
              name: mcp
          envFrom:
            - configMapRef:
                name: sqlbot-config
            - secretRef:
                name: sqlbot-secrets
          env:
            - name: SERVER_IMAGE_HOST
              value: "http://sqlbot-mcp-service:8001/images/"
          volumeMounts:
            - name: sqlbot-data
              mountPath: /opt/sqlbot/data
            - name: sqlbot-models
              mountPath: /opt/sqlbot/models
            - name: sqlbot-images
              mountPath: /opt/sqlbot/images
            - name: sqlbot-logs
              mountPath: /opt/sqlbot/app/logs
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/system/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
      volumes:
        - name: sqlbot-data
          persistentVolumeClaim:
            claimName: sqlbot-data-pvc
        - name: sqlbot-models
          persistentVolumeClaim:
            claimName: sqlbot-models-pvc
        - name: sqlbot-images
          emptyDir: {}
        - name: sqlbot-logs
          emptyDir: {}
      # Optional: Add node selector or affinity for GPU nodes
      # nodeSelector:
      #   accelerator: nvidia-gpu
---
apiVersion: v1
kind: Service
metadata:
  name: sqlbot-service
  namespace: sqlbot
  labels:
    app.kubernetes.io/name: sqlbot
    app.kubernetes.io/component: application
spec:
  selector:
    app.kubernetes.io/name: sqlbot
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: sqlbot-mcp-service
  namespace: sqlbot
  labels:
    app.kubernetes.io/name: sqlbot
    app.kubernetes.io/component: mcp
spec:
  selector:
    app.kubernetes.io/name: sqlbot
  ports:
    - port: 8001
      targetPort: 8001
      name: mcp
  type: ClusterIP
